<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Hasta que nos encontremos ❤️</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;

    background:
        radial-gradient(
            circle at 20% 10%,
            #fff5f7 0%,
            transparent 30%
        ),
        radial-gradient(
            circle at 80% 90%,
            #ffe0e8 0%,
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #fff8fa,
            #f9e8ed
        );

    color: #5b3842;

    overflow-x: hidden;
}


/* =====================================================
   FONDO
===================================================== */

.background-heart {

    position: fixed;

    color: #e8a5b5;

    opacity: .18;

    font-size: 25px;

    pointer-events: none;

    animation:
        floatingHeart
        7s
        ease-in-out
        infinite;

    z-index: 0;
}

@keyframes floatingHeart {

    0%,100% {
        transform:
            translateY(0)
            rotate(0deg);
    }

    50% {
        transform:
            translateY(-25px)
            rotate(10deg);
    }
}


/* =====================================================
   DECORACIÓN LATERAL
===================================================== */

.side-decor {

    position: fixed;

    top: 0;

    bottom: 0;

    width: 70px;

    display: flex;

    flex-direction: column;

    justify-content: space-evenly;

    align-items: center;

    pointer-events: none;

    z-index: 1;
}

.side-decor.left {
    left: 6px;
}

.side-decor.right {
    right: 6px;
}

.side-decor span {

    font-size: 20px;

    opacity: .38;

    color: #d98da0;

    animation:
        sideDrift
        6s
        ease-in-out
        infinite;
}

@keyframes sideDrift {

    0%,100% {
        transform:
            translateX(0)
            rotate(0deg);
    }

    50% {
        transform:
            translateX(6px)
            rotate(-8deg);
    }
}

@media (max-width: 760px) {

    .side-decor {
        display: none;
    }

}


/* =====================================================
   STICKERS (imágenes que el usuario puede cambiar)
===================================================== */

.content-frame {

    position: relative;
}

.sticker {

    position: absolute;

    width: 58px;

    height: auto;

    pointer-events: none;

    filter:
        drop-shadow(
            0 5px 10px
            rgba(120,60,80,.28)
        );

    z-index: 5;

    user-select: none;
}

.sticker-1 {
    top: -6px;
    left: 6px;
    transform: rotate(-12deg);
}

.sticker-2 {
    top: -6px;
    right: 6px;
    transform: rotate(11deg);
}

.sticker-3 {
    bottom: 4px;
    left: 6px;
    width: 52px;
    transform: rotate(9deg);
}

.sticker-4 {
    bottom: 4px;
    right: 6px;
    width: 52px;
    transform: rotate(-9deg);
}

@media (max-width: 500px) {

    .sticker {
        width: 44px;
    }

    .sticker-1 {
        top: -4px;
        left: 2px;
    }

    .sticker-2 {
        top: -4px;
        right: 2px;
    }

    .sticker-3 {
        left: 2px;
        width: 38px;
    }

    .sticker-4 {
        right: 2px;
        width: 38px;
    }

}


/* =====================================================
   CINTA LATERAL DEL CONTENEDOR
===================================================== */

.container {

    position: relative;

    z-index: 2;

    max-width: 650px;

    margin: auto;

    padding:
        35px
        26px
        60px;

    border-left:
        2px dashed
        rgba(198,120,140,.25);

    border-right:
        2px dashed
        rgba(198,120,140,.25);
}


/* =====================================================
   CABECERA
===================================================== */

.header {

    text-align: center;

    margin-bottom: 28px;
}

.heart-logo {

    font-size: 58px;

    animation:
        heartbeat
        1.8s
        ease-in-out
        infinite;
}

@keyframes heartbeat {

    0%,100% {
        transform: scale(1);
    }

    15% {
        transform: scale(1.12);
    }

    30% {
        transform: scale(1);
    }

    45% {
        transform: scale(1.08);
    }
}


h1 {

    margin:
        8px
        0
        5px;

    font-size: 30px;

    font-weight: 700;

    color: #8e4558;
}


.subtitle {

    margin: 0;

    font-size: 16px;

    color: #9b6b77;
}


/* =====================================================
   CUENTA ATRÁS
===================================================== */

.countdown {

    background:
        rgba(255,255,255,.75);

    border:
        1px solid
        rgba(180,100,120,.15);

    border-radius: 25px;

    padding: 20px;

    text-align: center;

    margin-bottom: 25px;

    box-shadow:
        0 10px 35px
        rgba(130,70,90,.12);

    backdrop-filter: blur(10px);
}


.countdown-label {

    font-size: 14px;

    color: #a06d7a;

    margin-bottom: 5px;
}


.days-left {

    font-size: 48px;

    font-weight: 800;

    color: #b65c72;

    line-height: 1;
}


.days-text {

    font-size: 15px;

    margin-top: 6px;

    color: #986575;
}


.tz-note {

    font-size: 11px;

    margin-top: 8px;

    color: #b98894;

    letter-spacing: .3px;
}


/* =====================================================
   CALENDARIO
===================================================== */

.calendar {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 12px;
}


.day {

    position: relative;

    aspect-ratio: 1 / 1;

    border: none;

    border-radius: 20px;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #f9e7ec
        );

    box-shadow:
        0 7px 18px
        rgba(130,70,90,.13);

    color: #9b5267;

    display: flex;

    justify-content: center;

    align-items: center;

    cursor: pointer;

    transition:
        transform .2s,
        box-shadow .2s;

    overflow: hidden;
}


.day:active {

    transform:
        scale(.94);
}


.day:hover {

    transform:
        translateY(-3px);

    box-shadow:
        0 12px 24px
        rgba(130,70,90,.2);
}


.day.locked {

    background:
        linear-gradient(
            145deg,
            #eeeeee,
            #e4e1e2
        );

    color: #aaa;

    cursor: default;

    box-shadow:
        none;
}


.day.opened {

    background:
        linear-gradient(
            145deg,
            #f8ccd8,
            #efb4c4
        );

    color: #813f52;
}


.number {

    font-size: 30px;

    font-weight: 800;
}


.icon {

    position: absolute;

    top: 8px;

    right: 10px;

    font-size: 15px;
}


.mini-heart {

    position: absolute;

    bottom: 7px;

    left: 9px;

    font-size: 12px;

    opacity: .6;
}


/* =====================================================
   TEXTO INFERIOR
===================================================== */

.footer {

    text-align: center;

    margin-top: 28px;

    color: #a27782;

    font-size: 13px;

    line-height: 1.7;
}


/* =====================================================
   MODAL
===================================================== */

.modal {

    position: fixed;

    inset: 0;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background:
        rgba(70,35,45,.55);

    backdrop-filter:
        blur(7px);

    z-index: 100;
}


.modal.show {

    display: flex;

    animation:
        fadeIn
        .25s
        ease;
}


@keyframes fadeIn {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}


/* =====================================================
   TARJETA
===================================================== */

.card {

    position: relative;

    width:
        min(
            500px,
            100%
        );

    max-height: 85vh;

    overflow-y: auto;

    background:
        linear-gradient(
            145deg,
            #fffafb,
            #fff2f5
        );

    border-radius: 28px;

    padding:
        30px
        23px;

    text-align: center;

    box-shadow:
        0 25px 70px
        rgba(60,25,35,.35);

    animation:
        cardOpen
        .35s
        ease;
}


@keyframes cardOpen {

    from {

        transform:
            scale(.82)
            translateY(20px);

        opacity: 0;
    }

    to {

        transform:
            scale(1)
            translateY(0);

        opacity: 1;
    }
}


.close {

    position: absolute;

    top: 10px;

    right: 13px;

    width: 38px;

    height: 38px;

    border: none;

    background: transparent;

    color: #9c6473;

    font-size: 28px;

    cursor: pointer;
}


.modal-heart {

    font-size: 50px;

    margin-bottom: 5px;
}


.modal-title {

    margin:
        0
        0
        15px;

    color: #9a4d62;

    font-size: 25px;
}


.message {

    font-size: 18px;

    line-height: 1.8;

    white-space: pre-line;

    color: #67434d;

    margin: 15px 0;
}


/* =====================================================
   IMAGEN
===================================================== */

.surprise-image {

    display: block;

    width: 100%;

    max-height: 330px;

    object-fit: cover;

    border-radius: 18px;

    margin:
        15px
        auto;
}


/* =====================================================
   VIDEO
===================================================== */

.video {

    width: 100%;

    border-radius: 18px;

    margin-top: 12px;
}


/* =====================================================
   BOTÓN
===================================================== */

.button {

    display: inline-block;

    margin-top: 12px;

    padding:
        12px
        25px;

    border-radius: 30px;

    background:
        linear-gradient(
            135deg,
            #c76a82,
            #a84f68
        );

    color: white;

    text-decoration: none;

    font-weight: 600;

    box-shadow:
        0 7px 15px
        rgba(150,70,90,.2);
}



/* =====================================================
   MONEDA AL AIRE (día 9)
===================================================== */
 
.coin-wrap {
 
    display: flex;
 
    justify-content: center;
 
    margin: 22px 0 10px;
 
    perspective: 700px;
}
 
.coin {
 
    width: 130px;
 
    height: 130px;
 
    position: relative;
 
    transform-style: preserve-3d;
 
    transition:
        transform
        2.4s
        cubic-bezier(.15, .65, .25, 1.15);
}
 
.coin-face {
 
    position: absolute;
 
    inset: 0;
 
    border-radius: 50%;
 
    display: flex;
 
    flex-direction: column;
 
    align-items: center;
 
    justify-content: center;
 
    font-size: 15px;
 
    font-weight: 700;
 
    line-height: 1.4;
 
    backface-visibility: hidden;
 
    box-shadow:
        inset 0 0 0 4px rgba(255,255,255,.55),
        0 8px 18px rgba(120,60,80,.3);
}
 
.coin-face span {
    font-size: 30px;
}
 
.coin-front {
 
    background:
        linear-gradient(145deg, #ffd1dc, #ff8fa3);
 
    color: #7a1f34;
}
 
.coin-back {
 
    background:
        linear-gradient(145deg, #ffd27a, #ff7a45);
 
    color: #7a3410;
 
    transform: rotateY(180deg);
}



/* =====================================================
   MINIJUEGO (día 6)
===================================================== */

.game-area {

    position: relative;

    width: 100%;

    height: 320px;

    border-radius: 20px;

    background-color: #fdf6ee;

    background-image:

        linear-gradient(
            180deg,
            transparent 0%,
            transparent 76%,
            #b97b3f 76%,
            #8a5828 100%
        ),

        repeating-linear-gradient(
            0deg,
            rgba(120,90,70,.10) 0px,
            rgba(120,90,70,.10) 1px,
            transparent 1px,
            transparent 34px
        ),

        repeating-linear-gradient(
            90deg,
            rgba(120,90,70,.10) 0px,
            rgba(120,90,70,.10) 1px,
            transparent 1px,
            transparent 34px
        );

    background-size: cover;

    background-position: center;

    overflow: hidden;

    margin: 15px 0;

    box-shadow:
        inset 0 0 0 1px
        rgba(180,100,120,.15);

    touch-action: none;
}

/*
    Si se carga una foto real de fondo (ver JS,
    variable BACKGROUNDS más abajo), esta clase
    sustituye el patrón de azulejos por la foto.
*/

.game-area.has-photo-bg {

    background-image:
        linear-gradient(
            180deg,
            rgba(255,255,255,.08),
            rgba(255,255,255,.08)
        ),
        var(--bg-photo);

    background-size: cover;

    background-position: center;
}

.game-item {

    position: absolute;

    bottom: -50px;

    width: 56px;

    height: 56px;

    object-fit: cover;

    border-radius: 50%;

    user-select: none;

    cursor: pointer;

    filter:
        drop-shadow(
            0 5px 9px
            rgba(120,60,80,.35)
        );

    animation-name: arcFly;

    animation-timing-function: ease-out;

    animation-fill-mode: forwards;

    will-change: transform;
}

.game-item.bomb {
    filter:
        drop-shadow(
            0 5px 9px
            rgba(180,40,30,.45)
        )
        saturate(1.4);
}

@keyframes arcFly {

    0% {
        transform: translateY(0) rotate(0deg);
    }

    50% {
        transform: translateY(var(--peak, -260px)) rotate(180deg);
    }

    100% {
        transform: translateY(40px) rotate(320deg);
    }
}


.game-item.sliced {

    animation: sliceItem .3s ease forwards !important;

    pointer-events: none;
}

@keyframes sliceItem {

    to {
        transform: scale(1.6) rotate(45deg);
        opacity: 0;
    }
}

.game-item.bomb-hit {

    animation: bombHit .35s ease forwards !important;

    pointer-events: none;
}

@keyframes bombHit {

    0% {
        filter: brightness(1);
    }

    40% {
        transform: scale(1.5);
        filter: brightness(2) saturate(2);
    }

    100% {
        transform: scale(0.4);
        opacity: 0;
    }
}

.game-area.shake {
    animation: areaShake .3s ease;
}

@keyframes areaShake {

    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
}

.game-trail-canvas {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    pointer-events: none;

    z-index: 5;
}

.game-hud {

    display: flex;

    justify-content: space-between;

    align-items: center;

    font-size: 14px;

    color: #9a5267;

    margin-bottom: 8px;

    font-weight: 600;
}

.game-result {

    font-size: 17px;

    line-height: 1.8;

    color: #67434d;

    margin-top: 10px;
}


/* =====================================================
   TARJETA VINTAGE (día de la receta)
===================================================== */

.card.vintage {

    background:
        linear-gradient(
            160deg,
            #f8efd6,
            #efe0b8
        );

    border: 2px solid #c9a15a;
}

.card.vintage::before {

    content: "";

    position: absolute;

    inset: 12px;

    border: 1.5px dashed rgba(150, 108, 58, .45);

    border-radius: 18px;

    pointer-events: none;
}

.card.vintage .modal-title {

    color: #7a4b23;

    font-family: Georgia, "Songti SC", serif;
}

.card.vintage .message {

    color: #5c4225;

    text-align: left;

    font-size: 16px;

    line-height: 1.9;
}

.card.vintage .surprise-image {

    border: 6px solid #fff8ea;

    box-shadow: 0 10px 25px rgba(90, 60, 20, .35);
}


/* =====================================================
   ÚLTIMO DÍA
===================================================== */

.final-card {

    background:
        linear-gradient(
            145deg,
            #fff0f4,
            #ffe1e9
        );
}


.final-heart {

    font-size: 70px;

    animation:
        heartbeat
        1.5s
        infinite;
}


.final-title {

    font-size: 29px;

    color: #9a4059;

    margin: 10px 0;
}


.final-message {

    font-size: 19px;

    line-height: 1.8;

    color: #70424f;
}


/* =====================================================
   MINIJUEGO "AFEITA AL ESPAÑOL" (día 14)
===================================================== */

.beard-stage {

    position: relative;

    margin: 15px auto;

    max-width: 100%;

    border-radius: 18px;

    overflow: hidden;
}

.beard-image {

    display: block;

    width: 100%;

    max-height: 330px;

    object-fit: cover;

    border-radius: 18px;

    transition: filter .25s ease;
}

.beard-stage.shaking .beard-image {

    animation: beardShake .35s ease;
}

@keyframes beardShake {

    0%, 100% { transform: translateX(0) rotate(0deg); }
    20% { transform: translateX(-5px) rotate(-1.5deg); }
    40% { transform: translateX(4px) rotate(1.5deg); }
    60% { transform: translateX(-3px) rotate(-1deg); }
    80% { transform: translateX(3px) rotate(1deg); }
}

.beard-fx {

    position: absolute;

    font-size: 34px;

    pointer-events: none;

    z-index: 6;

    will-change: transform, opacity;
}

.beard-fx.hit {

    animation: beardHitPop .55s ease forwards;
}

@keyframes beardHitPop {

    0% {
        transform: scale(.2) rotate(0deg);
        opacity: 0;
    }

    30% {
        transform: scale(1.35) rotate(-12deg);
        opacity: 1;
    }

    100% {
        transform: scale(.85) rotate(10deg) translateY(-18px);
        opacity: 0;
    }
}

.beard-fx.shave {

    animation: beardShaveSwipe .7s ease forwards;
}

@keyframes beardShaveSwipe {

    0% {
        opacity: 0;
        transform: translate(-16px, 0) rotate(-8deg) scale(.8);
    }

    25% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        transform: translate(16px, -6px) rotate(10deg) scale(1.05);
    }
}

.beard-fx.pat {

    animation: beardPatFloat 1.1s ease forwards;
}

@keyframes beardPatFloat {

    0% {
        opacity: 0;
        transform: translateY(0) scale(.6);
    }

    20% {
        opacity: 1;
        transform: translateY(-6px) scale(1);
    }

    100% {
        opacity: 0;
        transform: translateY(-55px) scale(1.1);
    }
}

.beard-btn-row {

    display: flex;

    gap: 10px;

    justify-content: center;

    flex-wrap: wrap;

    margin-top: 14px;
}

.beard-btn-row .button {

    border: none;

    cursor: pointer;

    font-size: 15px;

    margin-top: 0;
}

.beard-btn-row .button.secondary {

    background:
        linear-gradient(
            135deg,
            #7fb8a0,
            #4f9179
        );
}

.beard-btn-row .button.pat {

    background:
        linear-gradient(
            135deg,
            #e7a8c2,
            #c9709b
        );
}

.beard-btn-row .button:disabled {

    opacity: .45;

    cursor: default;
}


/* =====================================================
   CASETE (día 18: mixtape de la historia)
===================================================== */

.tape-wrap {

    display: flex;

    justify-content: center;

    margin: 10px 0 20px;
}

.tape-body {

    position: relative;

    width: 100%;

    max-width: 380px;

    aspect-ratio: 5 / 3;

    border-radius: 16px;

    background:
        linear-gradient(
            155deg,
            #6b4a3a,
            #3f2c22
        );

    box-shadow:
        0 12px 26px rgba(60, 30, 20, .35),
        inset 0 0 0 2px rgba(255, 235, 210, .12);

    padding: 16px 20px;

    display: flex;

    flex-direction: column;

    justify-content: space-between;
}

.tape-label {

    background: #f6ecd8;

    border-radius: 8px;

    padding: 8px 12px;

    text-align: center;

    color: #7a4b23;

    font-size: 13px;

    font-weight: 700;

    letter-spacing: .5px;

    box-shadow: inset 0 0 0 1px rgba(150, 108, 58, .35);
}

.tape-reels {

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 0 26px;
}

.reel {

    width: 62px;

    height: 62px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #e9dcc2 0%,
            #e9dcc2 18%,
            #4a3324 19%,
            #4a3324 100%
        );

    position: relative;

    animation: reelSpin 3.2s linear infinite;
}

.reel::before,
.reel::after {

    content: "";

    position: absolute;

    top: 50%;

    left: 50%;

    width: 34px;

    height: 4px;

    background: #2c1d14;

    transform: translate(-50%, -50%);
}

.reel::after {
    transform: translate(-50%, -50%) rotate(90deg);
}

@keyframes reelSpin {
    to { transform: rotate(360deg); }
}

.tape-eq {

    display: flex;

    align-items: flex-end;

    justify-content: center;

    gap: 5px;

    height: 26px;
}

.tape-eq span {

    width: 5px;

    border-radius: 3px;

    background: #f0a5bb;

    animation: eqBounce 1s ease-in-out infinite;
}

.tape-eq span:nth-child(1) { animation-delay: 0s; }
.tape-eq span:nth-child(2) { animation-delay: .15s; }
.tape-eq span:nth-child(3) { animation-delay: .3s; }
.tape-eq span:nth-child(4) { animation-delay: .1s; }
.tape-eq span:nth-child(5) { animation-delay: .25s; }

@keyframes eqBounce {
    0%, 100% { height: 6px; }
    50% { height: 24px; }
}

.track-list {

    text-align: left;

    margin: 6px 0 18px;

    padding: 0;

    list-style: none;
}

.track-list li {

    display: flex;

    align-items: center;

    gap: 10px;

    padding: 10px 4px;

    border-bottom: 1px dashed rgba(180, 100, 120, .25);

    font-size: 14px;

    color: #6b4552;
}

.track-list li:last-child {

/* =====================================================
   🇨🇳 UTILIDADES DE HORA DE CHINA
===================================================== */


function getChinaDateParts() {

    const formatter =
        new Intl.DateTimeFormat(
            "en-US",
            {
                timeZone: "Asia/Shanghai",
                year: "numeric",
                month: "2-digit",
                day: "2-digit"
            }
        );

    const parts =
        formatter.formatToParts(
            new Date()
        );

    const map = {};

    parts.forEach(
        p => {
            map[p.type] =
                p.value;
        }
    );

    return {
        year: parseInt(map.year, 10),
        month: parseInt(map.month, 10),
        day: parseInt(map.day, 10)
    };

}



/* =====================================================
   📅 CALCULAR DÍA ACTUAL (según calendario de China)
===================================================== */


function getCurrentDay() {

    const chinaToday =
        getChinaDateParts();

    const todayUTC =
        Date.UTC(
            chinaToday.year,
            chinaToday.month - 1,
            chinaToday.day
        );

    const startUTC =
        Date.UTC(
            START_DATE_PARTS.year,
            START_DATE_PARTS.month - 1,
            START_DATE_PARTS.day
        );

    const difference =
        Math.floor(
            (
                todayUTC - startUTC
            )
            /
            (
                1000 *
                60 *
                60 *
                24
            )
        );

    return difference + 1;
}



/* =====================================================
   ⏳ CUENTA ATRÁS
===================================================== */


function updateCountdown() {

    const now =
        new Date();

    const difference =
        MEETING_DATE - now;

    const days =
        Math.max(
            0,
            Math.ceil(
                difference /
                (
                    1000 *
                    60 *
                    60 *
                    24
                )
            )
        );

    document
        .getElementById("daysLeft")
        .textContent = days;

}


updateCountdown();

setInterval(
    updateCountdown,
    60000
);

function renderCalendar() {

    const calendar =
        document.getElementById(

    calendar.innerHTML = "";

    const currentDay =
        getCurrentDay();


    surprises.forEach(
        item => {

            const day =
                document.createElement(

            day.className =

                day.classList.add(
                    "locked"

                day.innerHTML = `

                    <span class="number">

                    <span class="icon">

                    <span class="mini-heart">

                day.onclick =

                );

                day.innerHTML = `

                    <span class="icon">

                day.onclick =
                    function() {

                        openSurprise(
                            item
                        );

                    };

            }


            calendar.appendChild(
                day
            );

        }
    );

}


renderCalendar();

function renderSideDecor() {

    const left =
        document.getElementById(

    for (

        i < 7;
        i++
    ) {

        const symbolLeft =
            symbols[
                Math.floor(
                    Math.random() *
                    symbols.length
                )
            ];

        const symbolRight =
            symbols[
                Math.floor(
                    Math.random() *
                    symbols.length
                )
            ];

        const spanLeft =
            document.createElement(
                "span"
            );

        spanLeft.textContent =
            symbolLeft;

        spanLeft.style.animationDelay =
            (i * 0.4) + "s";

        const spanRight =
            document.createElement(
                "span"
            );

        spanRight.textContent =
            symbolRight;

        spanRight.style.animationDelay =
            (i * 0.5) + "s";

        left.appendChild(
            spanLeft
        );

        right.appendChild(
            spanRight
        );

    }

}

/* =====================================================
   🖼️ STICKERS DE RELLENO (hasta que pongas los tuyos)
===================================================== */


const stickerFallbacks = [

    { emoji: "🌸", bg: "#ffd7e0" },
    { emoji: "✨", bg: "#ffe9ee" },
    { emoji: "🧸", bg: "#ffe0c9" },
    { emoji: "🍓", bg: "#ffd0d8" }

];


function makeFallbackSticker(
    emoji,
    bg
) {

    const svg =
        '<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140">' +
        '<circle cx="70" cy="70" r="66" fill="' + bg + '"/>' +
        '<text x="70" y="92" font-size="70" text-anchor="middle">' +
        emoji +
        '</text></svg>';

    return (
        "data:image/svg+xml;base64," +
        btoa(
            unescape(
                encodeURIComponent(svg)
            )
        )
    );

}


function initStickers() {

    const stickers =
        document.querySelectorAll(
            ".sticker"
        );

    stickers.forEach(
        (img, index) => {

            img.addEventListener(
                "error",
                function handler() {

                    img.removeEventListener(
                        "error",
                        handler
                    );

                    const fallback =
                        stickerFallbacks[
                            index %
                            stickerFallbacks.length
                        ];

                    img.src =
                        makeFallbackSticker(
                            fallback.emoji,
                            fallback.bg
                        );

                }
            );

        }
    );

}


initStickers();

/* =====================================================
   🖼️ CARGA DE IMAGEN CON REINTENTOS DE EXTENSIÓN
   Si pones "rosa.jpg" en la configuración pero tu archivo
   en realidad es "rosa.png" (o .jpeg, .webp, mayúsculas...),
   esto lo intenta detectar solo, antes de rendirse y
   mostrar el dibujo de relleno.
===================================================== */


function buildImageCandidates(src) {

    const dotIndex =
        src.lastIndexOf(".");

    const base =
        dotIndex !== -1
        ? src.substring(0, dotIndex)
        : src;

    const rawList = [

        src,
        base + ".jpg",
        base + ".JPG",
        base + ".jpeg",
        base + ".JPEG",
        base + ".png",
        base + ".PNG",
        base + ".webp",
        base + ".WEBP",
        base + ".heic",
        base + ".HEIC"

    ];

    const seen = new Set();

    return rawList.filter(
        function(candidate) {

            if (seen.has(candidate)) return false;

            seen.add(candidate);

            return true;

        }
    );

}


function loadImageWithFallbacks(
    imgEl,
    originalSrc,
    onAllFailed
) {

    const candidates =
        buildImageCandidates(originalSrc);

    let index = 0;

    function tryNext() {

        if (index >= candidates.length) {

            if (onAllFailed) onAllFailed();

            return;

        }

        imgEl.onerror = function() {

            index++;

            tryNext();

        };

        imgEl.src =
            candidates[index];

    }

    tryNext();

}

        item.background;

}

/* =====================================================
   🖼️ CARGA DE IMAGEN CON FALLBACK A EMOJI (canvas)
===================================================== */


function loadCanvasSprite(src) {

    const sprite = {
        img: new Image(),
        loaded: false
    };

    sprite.img.onload = function() {
        sprite.loaded = true;
    };

    sprite.img.src = src;

    return sprite;

}



/* =====================================================
   🎮 LÓGICA DEL MINIJUEGO "VUELA A CHINA"
   (estilo Flappy Bird)
===================================================== */


function startFlappyGame(item) {

    let area =
        document.getElementById("gameArea");

    const scoreLabel =
        document.getElementById("gameScore");

    const progressLabel =
        document.getElementById("gameTimer");

    const resultBox =
        document.getElementById("gameResult");

    resultBox.innerHTML =
        "";

    /*
        Se sustituye el nodo por un clon limpio
        para no acumular listeners entre reintentos
    */

    const freshArea =
        area.cloneNode(false);

    area.parentNode.replaceChild(
        freshArea,
        area
    );

    area = freshArea;


    const canvas =
        document.createElement("canvas");

    canvas.className =
        "game-trail-canvas";

    canvas.style.pointerEvents =
        "none";

    canvas.width =
        area.clientWidth || 300;

    canvas.height =
        area.clientHeight || 320;

    area.appendChild(canvas);

    const ctx =
        canvas.getContext("2d");

    const W = canvas.width;

    const H = canvas.height;


    const planeX = 55;

    const gravity = 0.22;

    const flapPower = -4.5;

    const pillarWidth = 50;

    const gapHeight =
        Math.max(105, H * 0.36);

    const pillarSpacing = 215;

    const scrollSpeed = 1.5;

    const totalObstacles = 8;


    let planeY = H / 2;

    let velocity = 0;

    let started = false;

    let gameOver = false;

    let score = 0;

    let rafId = null;

    let pillars = [];

    let finish = null;

    let start = null;

    let planeParticles = [];

    let hillOffset = 0;


    const planeSprite =
        loadCanvasSprite(item.planeImg);

    const startSprite =
        loadCanvasSprite(item.startImg);

    const goalSprite =
        loadCanvasSprite(item.goalImg);


    const buildingImgs =
        item.buildings || [];


    /* =====================================================
        🗺️ REGIONES DEL VIAJE
        (España -> Europa -> Rusia -> China)
        Cada tramo cambia el color del cielo y, si has
        subido una foto en "buildings" del día 8, se usa
        esa foto para el edificio/paisaje de ese tramo.
    ===================================================== */

    const regions = [

        {
            name: "España",
            style: "spain",
            base: "#d98a4f",
            accent: "#8c5a2b",
            sky: ["#8ec9f0", "#fef6e4"],
            sprite: loadCanvasSprite(
                buildingImgs[0] && buildingImgs[0].img
            )
        },

        {
            name: "Europa",
            style: "europe",
            base: "#8b95a1",
            accent: "#4a5560",
            sky: ["#9fb9d8", "#eef2f7"],
            sprite: loadCanvasSprite(
                buildingImgs[1] && buildingImgs[1].img
            )
        },

        {
            name: "Rusia",
            style: "russia",
            base: "#c0392b",
            accent: "#f1c40f",
            sky: ["#7fa2c9", "#dbe6f2"],
            sprite: loadCanvasSprite(
                buildingImgs[2] && buildingImgs[2].img
            )
        },

        {
            name: "China",
            style: "china",
            base: "#c0392b",
            accent: "#f4d35e",
            sky: ["#f4a261", "#ffe3c2"],
            sprite: loadCanvasSprite(
                buildingImgs[3] && buildingImgs[3].img
            )
        }

    ];


    function regionForIndex(i) {

        const perRegion =
            totalObstacles / regions.length;

        const idx =
            Math.min(
                regions.length - 1,
                Math.floor(i / perRegion)
            );

        return regions[idx];

    }


    function hexToRgb(hex) {

        const clean =
            hex.replace("#", "");

        return {
            r: parseInt(clean.substring(0, 2), 16),
            g: parseInt(clean.substring(2, 4), 16),
            b: parseInt(clean.substring(4, 6), 16)
        };

    }


    function lerp(a, b, t) {
        return a + (b - a) * t;
    }


    function lerpColor(hexA, hexB, t) {

        const a = hexToRgb(hexA);

        const b = hexToRgb(hexB);

        const r = Math.round(lerp(a.r, b.r, t));

        const g = Math.round(lerp(a.g, b.g, t));

        const bl = Math.round(lerp(a.b, b.b, t));

        return "rgb(" + r + "," + g + "," + bl + ")";

    }


    function currentSkyColors(progressFrac) {

        const steps =
            regions.length - 1;

        const pos =
            Math.max(0, Math.min(1, progressFrac)) * steps;

        const i0 =
            Math.min(steps, Math.floor(pos));

        const i1 =
            Math.min(steps, i0 + 1);

        const t =
            pos - i0;

        return {
            top: lerpColor(regions[i0].sky[0], regions[i1].sky[0], t),
            bottom: lerpColor(regions[i0].sky[1], regions[i1].sky[1], t)
        };

    }


    function resetTrack() {

        pillars = [];

        for (let i = 0; i < totalObstacles; i++) {

            const margin = 55;

            const gapY =
                margin +
                Math.random() * (H - margin * 2 - gapHeight);

            pillars.push({
                x: W + 80 + i * pillarSpacing,
                gapY: gapY,
                passed: false,
                region: regionForIndex(i)
            });

        }

        finish = {
            x: pillars[pillars.length - 1].x + pillarSpacing * 0.85
        };

        start = {
            x: 26
        };

    }


    resetTrack();


    /*
        🏔️ COLINAS DE FONDO (parallax, solo decorativas)
    */

    function drawHills() {

        const baseY =
            H - 34;

        const amplitude = 9;

        const wavelength = 95;

        ctx.fillStyle =
            "rgba(90,110,95,.22)";

        ctx.beginPath();

        ctx.moveTo(0, H);

        for (let x = 0; x <= W; x += 12) {

            const y =
                baseY +
                Math.sin((x + hillOffset) / wavelength) * amplitude;

            ctx.lineTo(x, y);

        }

        ctx.lineTo(W, H);

        ctx.closePath();

        ctx.fill();

    }


    /*
        💨 ESTELA DEL AVIÓN (pequeñas partículas)
    */

    function updateAndDrawPlaneTrail() {

        planeParticles.forEach(function(p) {

            p.x -= scrollSpeed;

            p.life -= 0.045;

        });

        planeParticles =
            planeParticles.filter(
                p => p.life > 0
            );

        planeParticles.forEach(function(p) {

            ctx.fillStyle =
                "rgba(255,255,255," + (p.life * 0.55) + ")";

            ctx.beginPath();

            ctx.arc(
                p.x, p.y,
                3 * p.life + 1,
                0, Math.PI * 2
            );

            ctx.fill();

        });

    }


    function roundRectPath(x, y, w, h, r) {

        const rr =
            Math.max(0, Math.min(r, w / 2, h / 2));

        ctx.beginPath();

        ctx.moveTo(x + rr, y);

        ctx.arcTo(x + w, y, x + w, y + h, rr);

        ctx.arcTo(x + w, y + h, x, y + h, rr);

        ctx.arcTo(x, y + h, x, y, rr);

        ctx.arcTo(x, y, x + w, y, rr);

        ctx.closePath();

    }


    /*
        ☁️ OBSTÁCULO SUPERIOR: nube (tintada según la región)
    */

    function drawCloudPillar(x, y, w, h, region) {

        if (h <= 0) return;

        ctx.fillStyle =
            "rgba(255,255,255,.92)";

        ctx.strokeStyle =
            region.accent + "88";

        ctx.lineWidth = 2;

        const edgeY =
            y + h;

        const lobes = 3;

        const lobeW =
            w / lobes;

        ctx.beginPath();

        ctx.moveTo(x, y);

        ctx.lineTo(x + w, y);

        ctx.lineTo(x + w, edgeY - lobeW * 0.55);

        for (let i = lobes - 1; i >= 0; i--) {

            const cx =
                x + i * lobeW + lobeW / 2;

            ctx.arc(
                cx,
                edgeY - lobeW * 0.55,
                lobeW / 2 + 5,
                0,
                Math.PI,
                false
            );

        }

        ctx.lineTo(x, y);

        ctx.closePath();

        ctx.fill();

        ctx.stroke();

    }


    /*
        🏰 OBSTÁCULO INFERIOR: monumento/edificio
        según la región (España, Europa, Rusia, China)
    */

    function drawBuilding(x, yTop, w, h, region) {

        if (h <= 0) return;

        if (region.sprite && region.sprite.loaded) {

            ctx.drawImage(
                region.sprite.img,
                x, yTop, w, h
            );

            ctx.strokeStyle =
                "rgba(255,255,255,.5)";

            ctx.lineWidth = 2;

            ctx.strokeRect(x, yTop, w, h);

            return;

        }

        if (region.style === "spain") {

            drawSpainBuilding(x, yTop, w, h, region);

        } else if (region.style === "europe") {

            drawEuropeTower(x, yTop, w, h, region);

        } else if (region.style === "russia") {

            drawRussiaBuilding(x, yTop, w, h, region);

        } else {

            drawChinaBuilding(x, yTop, w, h, region);

        }

    }


    function drawSpainBuilding(x, yTop, w, h, region) {

        ctx.fillStyle = region.base;

        ctx.fillRect(x, yTop, w, h);

        const teeth = 4;

        const toothW = w / (teeth * 2);

        ctx.fillStyle = region.accent;

        for (let t = 0; t < teeth; t++) {

            ctx.fillRect(
                x + t * 2 * toothW,
                yTop - 9,
                toothW,
                9
            );

        }

        ctx.fillStyle = "rgba(255,255,255,.45)";

        for (let wy = yTop + 22; wy < yTop + h - 14; wy += 30) {

            ctx.fillRect(x + w / 2 - 4, wy, 8, 14);

        }

    }


    function drawEuropeTower(x, yTop, w, h, region) {

        ctx.fillStyle = region.base;

        ctx.beginPath();

        ctx.moveTo(x, yTop + h);

        ctx.lineTo(x + w * 0.18, yTop);

        ctx.lineTo(x + w * 0.82, yTop);

        ctx.lineTo(x + w, yTop + h);

        ctx.closePath();

        ctx.fill();

        ctx.strokeStyle = region.accent;

        ctx.lineWidth = 1;

        for (let ly = yTop + 12; ly < yTop + h; ly += 20) {

            const frac = (ly - yTop) / h;

            const half = w * (0.18 + 0.32 * frac);

            const cx = x + w / 2;

            ctx.beginPath();

            ctx.moveTo(cx - half, ly);

            ctx.lineTo(cx + half, ly);

            ctx.stroke();

        }

    }


    function drawRussiaBuilding(x, yTop, w, h, region) {

        ctx.fillStyle = "#f5ecd7";

        ctx.fillRect(x, yTop + 18, w, h - 18);

        const cx = x + w / 2;

        ctx.fillStyle = region.base;

        ctx.beginPath();

        ctx.ellipse(cx, yTop, w * 0.34, 14, 0, 0, Math.PI * 2);

        ctx.fill();

        ctx.fillStyle = region.accent;

        ctx.beginPath();

        ctx.moveTo(cx, yTop - 26);

        ctx.quadraticCurveTo(cx - w * 0.3, yTop - 12, cx, yTop + 4);

        ctx.quadraticCurveTo(cx + w * 0.3, yTop - 12, cx, yTop - 26);

        ctx.closePath();

        ctx.fill();

        ctx.strokeStyle = region.accent;

        ctx.beginPath();

        ctx.moveTo(cx, yTop - 26);

        ctx.lineTo(cx, yTop - 38);

        ctx.stroke();

    }


    function drawChinaBuilding(x, yTop, w, h, region) {

        const tiers = 3;

        const tierH =
            Math.min(24, h / (tiers + 1));

        ctx.fillStyle = "#8c5a2b";

        ctx.fillRect(
            x + w * 0.42,
            yTop + tierH * 0.6,
            w * 0.16,
            h - tierH * 0.6
        );

        for (let t = 0; t < tiers; t++) {

            const shrink = t * 6;

            const tw = w - shrink * 2;

            const tx = x + shrink;

            const ty = yTop + t * tierH * 0.85;

            ctx.fillStyle = region.base;

            ctx.beginPath();

            ctx.moveTo(tx - 8, ty + tierH);

            ctx.lineTo(tx + tw * 0.5, ty);

            ctx.lineTo(tx + tw + 8, ty + tierH);

            ctx.closePath();

            ctx.fill();

            ctx.strokeStyle = region.accent;

            ctx.stroke();

        }

    }


    /*
        ✈️ AVIÓN DIBUJADO (usado si no hay imagen propia)
    */

    function drawPlaneIcon(x, y, angle) {

        ctx.save();

        ctx.translate(x, y);

        ctx.rotate(angle);

        ctx.fillStyle = "#f5f5f5";

        ctx.strokeStyle = "#c0392b";

        ctx.lineWidth = 1.4;

        ctx.beginPath();

        ctx.ellipse(0, 0, 20, 7, 0, 0, Math.PI * 2);

        ctx.fill();

        ctx.stroke();

        ctx.beginPath();

        ctx.moveTo(20, 0);

        ctx.lineTo(13, -4);

        ctx.lineTo(13, 4);

        ctx.closePath();

        ctx.fillStyle = "#c0392b";

        ctx.fill();

        ctx.fillStyle = "#e3e3e3";

        ctx.beginPath();

        ctx.moveTo(-2, -5);

        ctx.lineTo(-15, -19);

        ctx.lineTo(-6, -5);

        ctx.closePath();

        ctx.fill();

        ctx.beginPath();

        ctx.moveTo(-2, 5);

        ctx.lineTo(-15, 19);

        ctx.lineTo(-6, 5);

        ctx.closePath();

        ctx.fill();

        ctx.fillStyle = "#c0392b";

        ctx.beginPath();

        ctx.moveTo(-16, -2);

        ctx.lineTo(-25, -10);

        ctx.lineTo(-16, 2);

        ctx.closePath();

        ctx.fill();

        ctx.fillStyle = "rgba(90,140,190,.7)";

        for (let wx = -8; wx <= 8; wx += 6) {

            ctx.beginPath();

            ctx.arc(wx, -1, 1.4, 0, Math.PI * 2);

            ctx.fill();

        }

        ctx.restore();

    }


    /*
        🏮 MARCA DE LLEGADA DIBUJADA (si no hay imagen propia)
    */

    function drawGoalIcon(x, y) {

        ctx.save();

        ctx.translate(x, y);

        ctx.strokeStyle = "#8c5a2b";

        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.moveTo(0, -24);

        ctx.lineTo(0, -34);

        ctx.stroke();

        ctx.fillStyle = "#c0392b";

        ctx.beginPath();

        ctx.ellipse(0, 0, 14, 20, 0, 0, Math.PI * 2);

        ctx.fill();

        ctx.strokeStyle = "#f4d35e";

        ctx.lineWidth = 2;

        ctx.stroke();

        ctx.fillStyle = "#f4d35e";

        ctx.fillRect(-6, -24, 12, 4);

        ctx.fillRect(-6, 20, 12, 4);

        ctx.restore();

    }


    function flap() {

        if (gameOver) return;

        started = true;

        velocity = flapPower;

    }


    area.addEventListener("pointerdown", function(e) {

        e.preventDefault();

        flap();

    });


    function crash() {

        if (gameOver) return;

        gameOver = true;

        if (rafId) cancelAnimationFrame(rafId);

        showResult(false);

    }


    function succeed() {

        if (gameOver) return;

        gameOver = true;

        if (rafId) cancelAnimationFrame(rafId);

        showResult(true);

    }


    function showResult(isWin) {

        const finalScore =
            isWin ? totalObstacles : score;

        let finalMessage =
            item.results[0].message;

        item.results.forEach(function(tier) {

            if (finalScore >= tier.min) {

                finalMessage = tier.message;

            }

        });

        resultBox.innerHTML = "";

        const line =
            document.createElement("div");

        line.className =
            "message";

        line.textContent =
            (
                isWin
                ? "🎉 到达中国啦！(" + finalScore + "/" + totalObstacles + ")"
                : "💥 掉下来了 (" + finalScore + "/" + totalObstacles + ")"
            ) +
            "\n\n" +
            finalMessage;

        resultBox.appendChild(line);

        const retryBtn =
            document.createElement("button");

        retryBtn.className =
            "button";

        retryBtn.style.border =
            "none";

        retryBtn.style.cursor =
            "pointer";

        retryBtn.style.fontSize =
            "16px";

        retryBtn.textContent =
            "再来一次 🔁";

        retryBtn.addEventListener(
            "click",
            function() {

                startFlappyGame(item);

            }
        );

        resultBox.appendChild(retryBtn);

        if (isWin) {

            sendTelegramNotification(
                "✈️ ¡Llegó a China en el minijuego del día 8!"
            );

        }

    }


    function loop() {

        if (gameOver) return;

        const progressFrac =
            score / totalObstacles;

        const sky =
            currentSkyColors(progressFrac);

        const gradient =
            ctx.createLinearGradient(0, 0, 0, H);

        gradient.addColorStop(0, sky.top);

        gradient.addColorStop(1, sky.bottom);

        ctx.fillStyle = gradient;

        ctx.fillRect(0, 0, W, H);

        if (started) {

            velocity += gravity;

            planeY += velocity;

            pillars.forEach(function(p) {
                p.x -= scrollSpeed;
            });

            finish.x -= scrollSpeed;

            start.x -= scrollSpeed;

            hillOffset -= scrollSpeed * 0.4;

            if (Math.random() < 0.55) {

                planeParticles.push({
                    x: planeX - 20,
                    y: planeY + (Math.random() * 6 - 3),
                    life: 1
                });

            }

        } else {

            planeY =
                H / 2 + Math.sin(Date.now() / 300) * 8;

        }


        drawHills();


        pillars.forEach(function(p) {

            drawCloudPillar(p.x, 0, pillarWidth, p.gapY, p.region);

            drawBuilding(
                p.x,
                p.gapY + gapHeight,
                pillarWidth,
                H - (p.gapY + gapHeight),
                p.region
            );

        });


        updateAndDrawPlaneTrail();


        /*
            🇪🇸 Bandera de salida
            (parte del mundo: se queda atrás al volar,
            igual que la bandera de China se acerca)
        */

        if (start.x > -60) {

            if (startSprite.loaded) {

                ctx.drawImage(
                    startSprite.img,
                    start.x - 17, H - 46,
                    34, 24
                );

            } else {

                ctx.font = "26px sans-serif";

                ctx.textAlign = "center";

                ctx.fillText(
                    item.startFallback || "🇪🇸",
                    start.x,
                    H - 22
                );

            }

        }


        if (finish.x < W + 60) {

            if (goalSprite.loaded) {

                ctx.drawImage(
                    goalSprite.img,
                    finish.x - 24,
                    H / 2 - 40,
                    48,
                    80
                );

            } else {

                ctx.font = "44px sans-serif";

                ctx.textAlign = "center";

                ctx.fillText(
                    item.goalFallback || "🇨🇳",
                    finish.x,
                    H / 2 + 16
                );

            }

        }


        ctx.save();

        ctx.globalAlpha = .18;

        ctx.fillStyle = "#1a1a1a";

        ctx.beginPath();

        ctx.ellipse(planeX, H - 8, 20, 5, 0, 0, Math.PI * 2);

        ctx.fill();

        ctx.restore();


        if (planeSprite.loaded) {

            ctx.save();

            ctx.translate(planeX, planeY);

            ctx.rotate(
                Math.max(-0.4, Math.min(0.9, velocity / 12))
            );

            ctx.drawImage(
                planeSprite.img,
                -22, -16, 44, 32
            );

            ctx.restore();

        } else {

            drawPlaneIcon(
                planeX,
                planeY,
                Math.max(-0.4, Math.min(0.9, velocity / 12))
            );

        }


        if (started && !gameOver) {

            if (planeY - 16 <= 0 || planeY + 16 >= H) {

                crash();

            }

            pillars.forEach(function(p) {

                if (!p.passed && p.x + pillarWidth < planeX) {

                    p.passed = true;

                    score++;

                    scoreLabel.textContent =
                        "✈️ " + score;

                    progressLabel.textContent =
                        "🇪🇸 " +
                        Math.round((score / totalObstacles) * 100) +
                        "% 🇨🇳";

                }

                const withinX =
                    planeX + 18 > p.x &&
                    planeX - 18 < p.x + pillarWidth;

                if (withinX) {

                    const hitsGap =
                        planeY - 16 < p.gapY ||
                        planeY + 16 > p.gapY + gapHeight;

                    if (hitsGap) crash();

                }

            });

            if (!gameOver && finish.x + 24 < planeX) {

                progressLabel.textContent =
                    "🇪🇸 100% 🇨🇳";

                succeed();

            }

        }


        rafId =
            requestAnimationFrame(loop);

    }


    rafId =
        requestAnimationFrame(loop);

}



/* =====================================================
   🎮 LÓGICA DEL MINIJUEGO "CORTA LA FUSIÓN"
   (estilo Fruit Ninja: comida española + china)
===================================================== */


function startFusionGame(item) {

    const area =
        document.getElementById("gameArea");

    const scoreLabel =
        document.getElementById("gameScore");

    const timerLabel =
        document.getElementById("gameTimer");

    const resultBox =
        document.getElementById("gameResult");

    let score = 0;

    let timeLeft = item.duration;

    let spawnInterval;

    let timerInterval;

    let gameOver = false;

    let dragging = false;


    /*
        🔪 ESTELA BLANCA DEL CUCHILLO (estilo Fruit Ninja)
    */

    const trailCanvas =
        document.createElement("canvas");

    trailCanvas.className =
        "game-trail-canvas";

    trailCanvas.width =
        area.clientWidth || 280;

    trailCanvas.height =
        area.clientHeight || 320;

    area.appendChild(trailCanvas);

    const trailCtx =
        trailCanvas.getContext("2d");

    let trailPoints = [];

    let trailAnimId = null;

    const TRAIL_LIFETIME = 160;


    function recordTrailPoint(clientX, clientY) {

        const rect =
            area.getBoundingClientRect();

        trailPoints.push({
            x: clientX - rect.left,
            y: clientY - rect.top,
            t: performance.now()
        });

    }


    function drawTrailFrame() {

        if (gameOver) {

            trailCtx.clearRect(
                0, 0,
                trailCanvas.width,
                trailCanvas.height
            );

            return;

        }

        const now =
            performance.now();

        trailPoints =
            trailPoints.filter(
                p => now - p.t < TRAIL_LIFETIME
            );

        trailCtx.clearRect(
            0, 0,
            trailCanvas.width,
            trailCanvas.height
        );

        if (trailPoints.length > 1) {

            trailCtx.lineCap = "round";

            trailCtx.shadowColor = "rgba(255,255,255,.9)";

            trailCtx.shadowBlur = 10;

            for (let i = 1; i < trailPoints.length; i++) {

                const p0 = trailPoints[i - 1];

                const p1 = trailPoints[i];

                const age =
                    now - p1.t;

                const alpha =
                    Math.max(0, 1 - age / TRAIL_LIFETIME);

                trailCtx.strokeStyle =
                    "rgba(255,255,255," + alpha + ")";

                trailCtx.lineWidth =
                    5 * alpha + 1;

                trailCtx.beginPath();

                trailCtx.moveTo(p0.x, p0.y);

                trailCtx.lineTo(p1.x, p1.y);

                trailCtx.stroke();

            }

        }

        trailAnimId =
            requestAnimationFrame(drawTrailFrame);

    }


    trailAnimId =
        requestAnimationFrame(drawTrailFrame);


    area.addEventListener("pointermove", function(e) {

        if (!dragging) return;

        recordTrailPoint(e.clientX, e.clientY);

        /*
            En móvil, el "pointerenter" de cada fruta NO
            se dispara durante un arrastre (el navegador
            no vuelve a comprobar qué hay debajo del dedo).
            Por eso comprobamos aquí, a mano, qué elementos
            hay justo debajo del dedo/ratón en cada movimiento.
        */

        const hits =
            document.elementsFromPoint(e.clientX, e.clientY);

        hits.forEach(function(hitEl) {

            if (
                hitEl.classList &&
                hitEl.classList.contains("game-item") &&
                typeof hitEl._trySlice === "function"
            ) {

                hitEl._trySlice();

            }

        });

    });


    function spawnItem() {

        if (gameOver) return;

        const el =
            document.createElement("img");

        const isBomb =
            Math.random() < 0.22;

        const chosen =
            isBomb
            ? item.bombItem
            : item.goodItems[
                Math.floor(Math.random() * item.goodItems.length)
            ];

        el.className =
            "game-item" + (isBomb ? " bomb" : "");

        el.alt = "";

        el.src = chosen.img;

        el.addEventListener("error", function handler() {

            el.removeEventListener("error", handler);

            el.src =
                makeFallbackSticker(
                    chosen.fallback,
                    isBomb ? "#ffd9d0" : "#ffe0e6"
                );

        });

        const areaWidth =
            area.clientWidth || 280;

        const areaHeight =
            area.clientHeight || 320;

        const leftPos =
            20 + Math.random() * (areaWidth - 60);

        el.style.left =
            leftPos + "px";

        const peak =
            -(areaHeight * (0.55 + Math.random() * 0.35));

        el.style.setProperty("--peak", peak + "px");

        const flyTime =
            1.5 + Math.random() * 0.6;

        el.style.animationDuration =
            flyTime + "s";

        el.dataset.sliced = "false";

        function trySlice() {

            if (gameOver) return;

            if (el.dataset.sliced === "true") return;

            el.dataset.sliced = "true";

            if (isBomb) {

                el.classList.add("bomb-hit");

                score = Math.max(0, score - 3);

                area.classList.add("shake");

                setTimeout(function() {
                    area.classList.remove("shake");
                }, 300);

            } else {

                el.classList.add("sliced");

                score += 1;

            }

            scoreLabel.textContent = "🍽️ " + score;

            setTimeout(function() {
                el.remove();
            }, 350);

        }

        el._trySlice = trySlice;

        el.addEventListener("click", trySlice);

        el.addEventListener("animationend", function() {

            if (el.dataset.sliced === "false") {

                el.remove();

            }

        });

        area.appendChild(el);

    }


    area.addEventListener("pointerdown", function() {
        dragging = true;
    });

    window.addEventListener("pointerup", function() {
        dragging = false;
    });

    window.addEventListener("pointercancel", function() {
        dragging = false;
    });

    area.addEventListener("pointerleave", function() {
        dragging = false;
    });


    spawnInterval =
        setInterval(spawnItem, 480);


    timerInterval =
        setInterval(function() {

            timeLeft--;

            timerLabel.textContent =
                "⏱️ " + timeLeft + "s";

            if (timeLeft <= 0) {

                endGame();

            }

        }, 1000);


    function endGame() {

        gameOver = true;

        clearInterval(spawnInterval);

        clearInterval(timerInterval);

        if (trailAnimId) cancelAnimationFrame(trailAnimId);

        trailCtx.clearRect(
            0, 0,
            trailCanvas.width,
            trailCanvas.height
        );

        area.querySelectorAll(".game-item").forEach(
            function(el) {
                el.remove();
            }
        );

        let finalMessage =
            item.results[0].message;

        item.results.forEach(function(tier) {

            if (score >= tier.min) {

                finalMessage = tier.message;

            }

        });

        resultBox.textContent =
            "最终得分: " + score + " 🍽️\n\n" + finalMessage;

        sendTelegramNotification(
            "🔪 Jugó al minijuego del día 6 y consiguió " +
            score +
            " puntos"
        );

    }

}

/* =====================================================
   🧳 LÓGICA DEL MINIJUEGO "MALETA" (día 22)
===================================================== */


function startSuitcaseGame(item) {

    const grid =
        document.getElementById("suitcaseGrid");

    const checkBtn =
        document.getElementById("suitcaseCheckBtn");

    const resultBox =
        document.getElementById("suitcaseResult");

    const selected =
        new Set();

    grid.querySelectorAll(".suitcase-item").forEach(function(el) {

        el.addEventListener("click", function() {

            const idx = el.dataset.idx;

            if (selected.has(idx)) {

                selected.delete(idx);

                el.classList.remove("selected");

            } else {

                selected.add(idx);

                el.classList.add("selected");

            }

        });

    });

    checkBtn.addEventListener("click", function() {

        checkBtn.remove();

        let correct = 0;

        const totalReal =
            item.items.filter(function(it) { return it.real; }).length;

        grid.querySelectorAll(".suitcase-item").forEach(function(el) {

            const idx = parseInt(el.dataset.idx, 10);

            const data = item.items[idx];

            const isSelected =
                selected.has(String(idx));

            el.classList.add("disabled");

            if (data.real && isSelected) {

                el.classList.add("correct");

                correct++;

            } else if (!data.real && isSelected) {

                el.classList.add("wrong");

                const note =
                    document.createElement("span");

                note.className = "suitcase-note";

                note.textContent = data.note || "";

                el.appendChild(note);

            } else if (!data.real && !isSelected) {

                el.classList.add("correct");

            } else if (data.real && !isSelected) {

                el.classList.add("wrong");

            }

        });

        const line =
            document.createElement("div");

        line.className = "message";

        line.textContent =
            "猜对了 " + correct + " / " + totalReal + " 件真实携带的物品！\n\n" +
            (
                correct === totalReal
                ? "全对！看来你很了解我的行李箱 🧳❤️"
                : "差一点点，等我到了让你亲自检查行李箱 😆"
            );

        resultBox.appendChild(line);

        sendTelegramNotification(
            "🧳 Jugó al minijuego del día 22 y acertó " +
            correct + "/" + totalReal
        );

    });

}



/* =====================================================
   ✈️ LÓGICA DEL MINIJUEGO DE 4 FASES "AEROPUERTO" (día 23)
===================================================== */


function startAirportGame(item) {

    const stage =
        document.getElementById("airportStage");

    const progressDots =
        document.querySelectorAll("#airportProgress span");

    let stepIndex = 0;


    function setProgress(i) {

        progressDots.forEach(function(dot, idx) {

            dot.classList.remove("active", "done");

            if (idx < i) dot.classList.add("done");

            else if (idx === i) dot.classList.add("active");

        });

    }


    function nextStep() {

        stepIndex++;

        setProgress(stepIndex);

        if (stepIndex === 1) renderMapStep();

        else if (stepIndex === 2) renderScannerStep();

        else if (stepIndex === 3) renderDutyfreeStep();

        else renderDoneStep();

    }


    /*
        PASO 1: PASAPORTE
    */

    function renderPassportStep() {

        setProgress(0);

        const p =
            item.passport;

        stage.innerHTML = `

            <div class="airport-step">

                <div class="passport-card">
                    <div class="p-title">PASAPORTE · ESPAÑA</div>
                    <div class="p-row"><span>姓名 / Nombre</span><span>${p.name}</span></div>
                    <div class="p-row"><span>出生地 / Lugar de nacimiento</span><span>${p.birthplace}</span></div>
                    <div class="p-row"><span>国籍 / Nacionalidad</span><span>${p.nationality}</span></div>
                    <div class="p-row"><span>护照号 / No.</span><span>${p.passportNo}</span></div>
                </div>

                <div class="message" style="font-size:15px;">
                    海关官员，此人可以入境吗？🕵️‍♀️
                </div>

                <div class="airport-btn-row">
                    <button class="button" id="passApprove">批准入境 ✅</button>
                    <button class="button reject" id="passReject">再检查一下 🧐</button>
                </div>

            </div>

        `;

        document
            .getElementById("passApprove")
            .addEventListener("click", nextStep);

        document
            .getElementById("passReject")
            .addEventListener("click", function() {

                this.textContent =
                    "好吧好吧，他是好人 😅";

                this.disabled = true;

                document
                    .getElementById("passApprove")
                    .disabled = true;

                setTimeout(nextStep, 700);

            });

    }


    /*
        PASO 2: MAPA
    */

    function renderMapStep() {

        const steps =
            item.mapSteps || [

                "下飞机，出机场 🛬",
                "坐地铁到市区 🚇",
                "走到你家那条街 🚶‍♂️",
                "敲响你家的门 🚪❤️"

            ];

        const shuffled =
            steps
            .map(function(text, idx) {
                return { text: text, correctIdx: idx };
            })
            .sort(function() {
                return Math.random() - 0.5;
            });

        stage.innerHTML = `

            <div class="airport-step">

                <div class="message" style="font-size:15px;">
                    帮我按正确的顺序点一遍，才能找到你家 🗺️
                </div>

                <div class="map-puzzle" id="mapPuzzle"></div>

            </div>

        `;

        const puzzleEl =
            document.getElementById("mapPuzzle");

        let picks = [];

        shuffled.forEach(function(s) {

            const stepEl =
                document.createElement("div");

            stepEl.className = "map-step";

            stepEl.dataset.correctIdx = s.correctIdx;

            stepEl.innerHTML =
                '<span class="m-order"></span><span>' +
                s.text +
                '</span>';

            stepEl.addEventListener("click", function() {

                if (stepEl.classList.contains("picked")) return;

                picks.push(parseInt(stepEl.dataset.correctIdx, 10));

                stepEl.classList.add("picked");

                stepEl.querySelector(".m-order").textContent =
                    picks.length;

                if (picks.length === steps.length) {

                    const isCorrect =
                        picks.every(function(v, i) { return v === i; });

                    setTimeout(function() {

                        if (isCorrect) {

                            nextStep();

                        } else {

                            const msg =
                                document.createElement("div");

                            msg.className = "message";

                            msg.textContent =
                                "路线不太对，不过没关系，有你等着我，\n" +
                                "就算绕点路，我也一定能找到你家 😆";

                            puzzleEl.appendChild(msg);

                            setTimeout(nextStep, 1400);

                        }

                    }, 400);

                }

            });

            puzzleEl.appendChild(stepEl);

        });

    }


    /*
        PASO 3: ESCÁNER
    */

    function renderScannerStep() {

        stage.innerHTML = `

            <div class="airport-step">

                <div class="message" style="font-size:15px;">
                    安检时间！扫描一下我的行李箱 🔍
                </div>

                <div class="scanner-box" id="scannerBox">
                    💻 🩲 🪒 🎁
                </div>

                <div class="airport-btn-row">
                    <button class="button" id="scanBtn">开始扫描 📡</button>
                </div>

            </div>

        `;

        document
            .getElementById("scanBtn")
            .addEventListener("click", function() {

                this.disabled = true;

                this.textContent = "扫描中...";

                setTimeout(function() {

                    const msg =
                        document.createElement("div");

                    msg.className = "message";

                    msg.textContent =
                        "✅ 安检通过！\n没有违禁品，只有满满的爱和一堆吃的 🥰";

                    document
                        .getElementById("scannerBox")
                        .after(msg);

                    setTimeout(nextStep, 1200);

                }, 1600);

            });

    }


    /*
        PASO 4: DUTY FREE
    */

    function renderDutyfreeStep() {

        let timeLeft = 8;

        stage.innerHTML = `

            <div class="airport-step">

                <div class="message" style="font-size:15px;">
                    免税店太好逛了，小心别逛忘了时间，飞机可不等人！✈️💨
                </div>

                <div class="dutyfree-box">
                    <span>🍫</span><span>🥂</span><span>👜</span><span>🕶️</span><span>💄</span>
                </div>

                <div class="dutyfree-timer" id="dutyTimer">${timeLeft}</div>

                <div class="airport-btn-row">
                    <button class="button" id="boardBtn">快去登机！🏃‍♂️✈️</button>
                </div>

            </div>

        `;

        const timerEl =
            document.getElementById("dutyTimer");

        const boardBtn =
            document.getElementById("boardBtn");

        let missed = false;

        const countdown = setInterval(function() {

            timeLeft--;

            timerEl.textContent = timeLeft;

            if (timeLeft <= 0) {

                clearInterval(countdown);

                missed = true;

                boardBtn.disabled = true;

                const msg =
                    document.createElement("div");

                msg.className = "message";

                msg.textContent =
                    "糟糕，看免税店看得太入迷，差点误机！😱\n" +
                    "还好最后一刻冲上了飞机……下次不敢了 😆";

                stage.appendChild(msg);

                setTimeout(nextStep, 1600);

            }

        }, 1000);

        boardBtn.addEventListener("click", function() {

            if (missed) return;

            clearInterval(countdown);

            boardBtn.disabled = true;

            const msg =
                document.createElement("div");

            msg.className = "message";

            msg.textContent =
                "反应真快！成功登机，没有错过飞机 🎉✈️";

            stage.appendChild(msg);

            setTimeout(nextStep, 1200);

        });

    }


    /*
        PASO FINAL
    */

    function renderDoneStep() {

        setProgress(4);

        stage.innerHTML = `

            <div class="airport-step">

                <div class="message">
                    ${item.finalMessage}
                </div>

            </div>

        `;

        sendTelegramNotification(
            "✈️ Completó el minijuego de 4 fases del día 23"
        );

    }


    renderPassportStep();

}



/* =====================================================
   💍 LÓGICA DE LA DECLARACIÓN (día 24)
===================================================== */


function startProposeGame(item) {

    const noBtn =
        document.getElementById("proposeNo");

    const yesBtn =
        document.getElementById("proposeYes");

    const row =
        document.getElementById("proposeBtnRow");

    const resultBox =
        document.getElementById("proposeResult");

    let dodges = 0;


    function dodgeNo() {

        dodges++;

        const rowRect =
            row.getBoundingClientRect();

        const maxX =
            Math.max(20, rowRect.width - 90);

        const randomX =
            Math.random() * maxX - maxX / 2;

        const randomY =
            (Math.random() - 0.5) * 30;

        noBtn.style.transform =
            "translate(" + randomX + "px," + randomY + "px)";

        if (dodges >= 3) {

            noBtn.style.opacity = ".35";

            noBtn.textContent =
                "……好吧，随便你 🙈";

        }

    }


    noBtn.addEventListener(
        "pointerenter",
        dodgeNo
    );

    noBtn.addEventListener(
        "click",
        function(e) {

            e.preventDefault();

            dodgeNo();

        }
    );


    yesBtn.addEventListener("click", function() {

        yesBtn.disabled = true;

        noBtn.disabled = true;

        row.style.display = "none";

        const line =
            document.createElement("div");

        line.className = "final-message";

        line.textContent =
            item.yesMessage;

        resultBox.appendChild(line);

        sendTelegramNotification(
            "💍 ¡Dijo que SÍ el día 24!"
        );

    });

}



/* =====================================================
   🔊 SONIDOS SINTETIZADOS (sin archivos de audio)
   Se generan con Web Audio API: un "golpe" grave y seco,
   un "raspado" de afeitar y un "tin" suave para las caricias.
===================================================== */

let sharedAudioCtx = null;

function getAudioCtx() {

    if (!sharedAudioCtx) {

        const AC =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AC) return null;

        sharedAudioCtx = new AC();

    }

    if (sharedAudioCtx.state === "suspended") {

        sharedAudioCtx.resume();

    }

    return sharedAudioCtx;

}


function playPunchSound() {

    const ctx = getAudioCtx();

    if (!ctx) return;

    const now = ctx.currentTime;

    const osc = ctx.createOscillator();

    const gain = ctx.createGain();

    osc.type = "sine";

    osc.frequency.setValueAtTime(160, now);

    osc.frequency.exponentialRampToValueAtTime(45, now + 0.18);

    gain.gain.setValueAtTime(0.5, now);

    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

    osc.connect(gain);

    gain.connect(ctx.destination);

    osc.start(now);

    osc.stop(now + 0.22);

}


function playShaveSound() {

    const ctx = getAudioCtx();

    if (!ctx) return;

    const now = ctx.currentTime;

    const bufferSize = ctx.sampleRate * 0.35;

    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);

    const data = buffer.getChannelData(0);

    for (let i = 0; i < bufferSize; i++) {

        data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);

    }

    const noise = ctx.createBufferSource();

    noise.buffer = buffer;

    const filter = ctx.createBiquadFilter();

    filter.type = "highpass";

    filter.frequency.value = 1800;

    const gain = ctx.createGain();

    gain.gain.setValueAtTime(0.35, now);

    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

    noise.connect(filter);

    filter.connect(gain);

    gain.connect(ctx.destination);

    noise.start(now);

    noise.stop(now + 0.35);

}


function playPatSound() {

    const ctx = getAudioCtx();

    if (!ctx) return;

    const now = ctx.currentTime;

    [660, 880].forEach(function(freq, i) {

        const osc = ctx.createOscillator();

        const gain = ctx.createGain();

        osc.type = "triangle";

        osc.frequency.setValueAtTime(freq, now + i * 0.09);

        gain.gain.setValueAtTime(0.001, now + i * 0.09);

        gain.gain.exponentialRampToValueAtTime(0.28, now + i * 0.09 + 0.02);

        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.09 + 0.3);

        osc.connect(gain);

        gain.connect(ctx.destination);

        osc.start(now + i * 0.09);

        osc.stop(now + i * 0.09 + 0.32);

    });

}



/* =====================================================
   🪒 LÓGICA DEL MINIJUEGO "AFEITA AL ESPAÑOL" (día 14)
===================================================== */


function makeBeardFallback(hasBeard) {

    const svg =
        '<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240">' +
        '<rect width="320" height="240" fill="#ffe4ea"/>' +
        '<circle cx="160" cy="110" r="70" fill="#ffd8b8"/>' +
        (
            hasBeard
            ?
            '<path d="M95 120 Q160 210 225 120 Q225 175 160 190 Q95 175 95 120 Z" fill="#6b4a35"/>'
            :
            ''
        ) +
        '<circle cx="135" cy="95" r="6" fill="#5b3842"/>' +
        '<circle cx="185" cy="95" r="6" fill="#5b3842"/>' +
        '<text x="160" y="230" font-size="16" text-anchor="middle" fill="#9b5267">' +
        (hasBeard ? "Alejandro (con barba)" : "Alejandro (afeitado)") +
        '</text></svg>';

    return (
        "data:image/svg+xml;base64," +
        btoa(
            unescape(
                encodeURIComponent(svg)
            )
        )
    );

}


function spawnBeardFx(stage, emoji, kind) {

    const fx =
        document.createElement("span");

    fx.className =
        "beard-fx " + kind;

    fx.textContent =
        emoji;

    const stageWidth =
        stage.clientWidth || 280;

    const stageHeight =
        stage.clientHeight || 220;

    const x =
        10 + Math.random() * (stageWidth - 40);

    const y =
        10 + Math.random() * (stageHeight - 40);

    fx.style.left = x + "px";

    fx.style.top = y + "px";

    stage.appendChild(fx);

    fx.addEventListener("animationend", function() {

        fx.remove();

    });

}


function startBeardGame(item) {

    const stage =
        document.getElementById("beardStage");

    const image =
        document.getElementById("beardImage");

    const messageBox =
        document.getElementById("beardMessage");

    const hitBtn =
        document.getElementById("hitBtn");

    const shaveBtn =
        document.getElementById("shaveBtn");

    const buttonsRow =
        document.getElementById("beardButtons");

    const patRow =
        document.getElementById("patRow");

    const patBtn =
        document.getElementById("patBtn");

    let shaved = false;


    loadImageWithFallbacks(
        image,
        item.beardedImg,
        function() {

            image.src = makeBeardFallback(true);

        }
    );


    hitBtn.addEventListener("click", function() {

        if (shaved) return;

        playPunchSound();

        stage.classList.add("shaking");

        setTimeout(function() {
            stage.classList.remove("shaking");
        }, 350);

        const hitEmojis = ["👊", "💥", "😵"];

        let count = 0;

        const totalHits = 3;

        const hitInterval = setInterval(function() {

            spawnBeardFx(
                stage,
                hitEmojis[
                    Math.floor(Math.random() * hitEmojis.length)
                ],
                "hit"
            );

            count++;

            if (count >= totalHits) {

                clearInterval(hitInterval);

            }

        }, 160);

    });


    shaveBtn.addEventListener("click", function() {

        if (shaved) return;

        shaved = true;

        hitBtn.disabled = true;

        shaveBtn.disabled = true;

        playShaveSound();

        const shaveEmojis = ["🪒", "🧴", "✨"];

        let count = 0;

        const totalPasses = 4;

        const shaveInterval = setInterval(function() {

            spawnBeardFx(
                stage,
                shaveEmojis[
                    Math.floor(Math.random() * shaveEmojis.length)
                ],
                "shave"
            );

            count++;

            if (count >= totalPasses) {

                clearInterval(shaveInterval);

            }

        }, 150);

        setTimeout(function() {

            loadImageWithFallbacks(
                image,
                item.shavedImg,
                function() {

                    image.src = makeBeardFallback(false);

                }
            );

            messageBox.textContent =
                item.finalMessage;

            buttonsRow.style.display = "none";

            patRow.style.display = "flex";

            sendTelegramNotification(
                "🪒 ¡Lo afeitó en el minijuego del día 14!"
            );

        }, 750);

    });


    patBtn.addEventListener("click", function() {

        playPatSound();

        const patEmojis = ["🥰", "❤️", "✨"];

        let count = 0;

        const totalPats = 4;

        const patInterval = setInterval(function() {

            spawnBeardFx(
                stage,
                patEmojis[
                    Math.floor(Math.random() * patEmojis.length)
                ],
                "pat"
            );

            count++;

            if (count >= totalPats) {

                clearInterval(patInterval);

            }

        }, 180);

    });

}

function closeModal() {

    document
        .getElementById(
            "modal"
        )
        .classList.remove(
            "show"
        );

}

===================================================== */


document
    .getElementById(
        "modal"
    )
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target ===
                this
            ) {

                closeModal();

            }

        }
    );
