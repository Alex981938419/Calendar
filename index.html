<style>

* {
    box-sizing: border-box;

}

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;

    background:
        radial-gradient(
            circle at 20% 10%,
            #fff5f7 0%,
            transparent 30%
        ),
        radial-gradient(
            circle at 80% 90%,
            #ffe0e8 0%,
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #fff8fa,
            #f9e8ed
        );

    color: #5b3842;

    overflow-x: hidden;

/* =====================================================
   FONDO
===================================================== */

.background-heart {

    position: fixed;

    color: #e8a5b5;

    opacity: .18;

    font-size: 25px;

    pointer-events: none;

    animation:
        floatingHeart
        7s
        ease-in-out
        infinite;

    z-index: 0;
}

@keyframes floatingHeart {

    0%,100% {
        transform:
            translateY(0)
            rotate(0deg);
    }

    50% {
        transform:
            translateY(-25px)
            rotate(10deg);
    }
}


/* =====================================================
   DECORACIÓN LATERAL
===================================================== */

.side-decor {

    position: fixed;

    top: 0;

    bottom: 0;

    width: 70px;

    display: flex;

    flex-direction: column;

    justify-content: space-evenly;

    align-items: center;

    pointer-events: none;

    z-index: 1;
}

.side-decor.left {
    left: 6px;
}

.side-decor.right {
    right: 6px;
}

.side-decor span {

    font-size: 20px;

    opacity: .38;

    color: #d98da0;

    animation:
        sideDrift
        6s
        ease-in-out
        infinite;
}

@keyframes sideDrift {

    0%,100% {
        transform:
            translateX(0)
            rotate(0deg);
    }

    50% {
        transform:
            translateX(6px)
            rotate(-8deg);
    }
}

@media (max-width: 760px) {

    .side-decor {
        display: none;
    }

}


/* =====================================================
   STICKERS (imágenes que el usuario puede cambiar)
===================================================== */

.content-frame {

    position: relative;
}

.sticker {

    position: absolute;

    width: 58px;

    height: auto;

    pointer-events: none;

    filter:
        drop-shadow(
            0 5px 10px
            rgba(120,60,80,.28)
        );

    z-index: 5;

    user-select: none;
}

.sticker-1 {
    top: -6px;
    left: 6px;
    transform: rotate(-12deg);
}

.sticker-2 {
    top: -6px;
    right: 6px;
    transform: rotate(11deg);
}

.sticker-3 {
    bottom: 4px;
    left: 6px;
    width: 52px;
    transform: rotate(9deg);
}

.sticker-4 {
    bottom: 4px;
    right: 6px;
    width: 52px;
    transform: rotate(-9deg);
}

@media (max-width: 500px) {

    .sticker {
        width: 44px;
    }

    .sticker-1 {
        top: -4px;
        left: 2px;
    }

    .sticker-2 {
        top: -4px;
        right: 2px;
    }

    .sticker-3 {
        left: 2px;
        width: 38px;
    }

    .sticker-4 {
        right: 2px;
        width: 38px;
    }

}


/* =====================================================
   CINTA LATERAL DEL CONTENEDOR
===================================================== */

.container {

    position: relative;

    z-index: 2;

        26px
        60px;

    border-left:

    border-right:
        2px dashed

}


/* =====================================================

    text-align: center;

    margin-bottom: 28px;

.heart-logo {

    font-size: 58px;

    animation:
        heartbeat
        1.8s
        ease-in-out
        infinite;
}

@keyframes heartbeat {

    0%,100% {
        transform: scale(1);
    }

    15% {
        transform: scale(1.12);
    }

    30% {
        transform: scale(1);
    }

    45% {
        transform: scale(1.08);
    }
}


h1 {

    margin:

        0
        5px;

    font-size: 30px;

    font-weight: 700;

    color: #8e4558;
}


.subtitle {

    margin: 0;

    font-size: 16px;

    color: #9b6b77;
}


/* =====================================================
   CUENTA ATRÁS
===================================================== */

.countdown {

    background:
        rgba(255,255,255,.75);

    border:
        1px solid
        rgba(180,100,120,.15);

    border-radius: 25px;

    padding: 20px;

    text-align: center;

    margin-bottom: 25px;

    box-shadow:
        0 10px 35px
        rgba(130,70,90,.12);

    backdrop-filter: blur(10px);
}


.countdown-label {

    font-size: 14px;

    color: #a06d7a;

    margin-bottom: 5px;
}


.days-left {

    font-size: 48px;

    font-weight: 800;

    color: #b65c72;

    line-height: 1;
}


.days-text {

    font-size: 15px;

    margin-top: 6px;

    color: #986575;
}


.tz-note {

    font-size: 11px;

    margin-top: 8px;

    color: #b98894;

    letter-spacing: .3px;
}


/* =====================================================
   CALENDARIO
===================================================== */

.calendar {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 12px;
}


.day {

    position: relative;

    aspect-ratio: 1 / 1;

    border: none;

    border-radius: 20px;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #f9e7ec
        );

    box-shadow:
        0 7px 18px
        rgba(130,70,90,.13);

    color: #9b5267;

    display: flex;

    justify-content: center;

    align-items: center;

    cursor: pointer;

    transition:
        transform .2s,
        box-shadow .2s;

    overflow: hidden;
}


.day:active {

    transform:
        scale(.94);
}


.day:hover {

    transform:
        translateY(-3px);

    box-shadow:
        0 12px 24px
        rgba(130,70,90,.2);
}


.day.locked {

    background:
        linear-gradient(
            145deg,
            #eeeeee,
            #e4e1e2
        );

    color: #aaa;

    cursor: default;

    box-shadow:
        none;
}


.day.opened {

    background:
        linear-gradient(
            145deg,
            #f8ccd8,
            #efb4c4
        );

    color: #813f52;
}


.number {

    font-size: 30px;

    font-weight: 800;
}


.icon {

    position: absolute;

    top: 8px;

    right: 10px;

    font-size: 15px;
}


.mini-heart {

    position: absolute;

    bottom: 7px;

    left: 9px;

    font-size: 12px;

    opacity: .6;
}


/* =====================================================
   TEXTO INFERIOR
===================================================== */

.footer {

    text-align: center;

    margin-top: 28px;

    color: #a27782;

    font-size: 13px;

    line-height: 1.7;

/* =====================================================
   MODAL
===================================================== */

.modal {

    position: fixed;

    inset: 0;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background:
        rgba(70,35,45,.55);

    backdrop-filter:
        blur(7px);

    z-index: 100;
}


.modal.show {

    display: flex;

    animation:
        fadeIn
        .25s
        ease;
}


@keyframes fadeIn {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}


/* =====================================================
   TARJETA
===================================================== */

.card {

    position: relative;

    width:
        min(
            500px,
            100%
        );

    max-height: 85vh;

    overflow-y: auto;

    background:
        linear-gradient(
            145deg,
            #fffafb,
            #fff2f5

    border-radius: 28px;

    padding:

        23px;

    text-align: center;

    box-shadow:

    animation:

        ease;
}


@keyframes cardOpen {

    from {

        transform:
            scale(.82)
            translateY(20px);

        opacity: 0;
    }

    to {

        transform:
            scale(1)
            translateY(0);

        opacity: 1;
    }

.close {

.modal-heart {

/* =====================================================

.surprise-image {

/* =====================================================

        Se usa GET (en vez de POST con JSON) porque

        y el servidor de Telegram no la responde bien,

    );

/* =====================================================
   🇨🇳 UTILIDADES DE HORA DE CHINA
===================================================== */


function getChinaDateParts() {

    const formatter =
        new Intl.DateTimeFormat(
            "en-US",
            {
                timeZone: "Asia/Shanghai",
                year: "numeric",
                month: "2-digit",
                day: "2-digit"
            }
        );

    const parts =
        formatter.formatToParts(
            new Date()
        );

    const map = {};

    parts.forEach(
        p => {
            map[p.type] =
                p.value;
        }
    );

    return {
        year: parseInt(map.year, 10),
        month: parseInt(map.month, 10),
        day: parseInt(map.day, 10)
    };

}



/* =====================================================
   📅 CALCULAR DÍA ACTUAL (según calendario de China)
===================================================== */


function getCurrentDay() {

    const chinaToday =
        getChinaDateParts();

    const todayUTC =
        Date.UTC(
            chinaToday.year,
            chinaToday.month - 1,
            chinaToday.day
        );

    const startUTC =
        Date.UTC(
            START_DATE_PARTS.year,
            START_DATE_PARTS.month - 1,
            START_DATE_PARTS.day
        );

    const difference =
        Math.floor(
            (
                todayUTC - startUTC
            )
            /
            (
                1000 *
                60 *
                60 *
                24
            )
        );

    return difference + 1;
}



/* =====================================================
   ⏳ CUENTA ATRÁS
===================================================== */


function updateCountdown() {

    const now =
        new Date();

    const difference =
        MEETING_DATE - now;

    const days =
        Math.max(
            0,
            Math.ceil(
                difference /
                (
                    1000 *
                    60 *
                    60 *
                    24
                )
            )
        );

    document
        .getElementById("daysLeft")
        .textContent = days;

}


updateCountdown();

setInterval(
    updateCountdown,
    60000
);



/* =====================================================
   🎁 CREAR CALENDARIO
===================================================== */


function renderCalendar() {

    const calendar =
        document.getElementById(
            "calendar"
        );

    calendar.innerHTML = "";

    const currentDay =
        getCurrentDay();


    surprises.forEach(
        item => {

            const day =
                document.createElement(
                    "div"
                );


            day.className =
                "day";


            /*
                DÍA FUTURO
            */

            if (
                item.day >
                currentDay
            ) {

                day.classList.add(
                    "locked"
                );

                day.innerHTML = `

                    <span class="number">
                        ${item.day}
                    </span>

                    <span class="icon">
                        🔒
                    </span>

                    <span class="mini-heart">
                        ♡
                    </span>

                `;


                day.onclick =
                    function() {

                        showLockedMessage(
                            item.day
                        );

                    };

            }


            /*
                DÍA DISPONIBLE
            */

            else {

                day.classList.add(
                    "opened"
                );

                day.innerHTML = `

                    <span class="number">
                        ${item.day}
                    </span>

                    <span class="icon">
                        ❤️
                    </span>

                    <span class="mini-heart">
                        ✨
                    </span>

                `;


                day.onclick =
                    function() {

                        openSurprise(
                            item
                        );

                    };

            }


            calendar.appendChild(
                day
            );

        }
    );

}


renderCalendar();



/* =====================================================
   🌸 DECORACIÓN LATERAL DINÁMICA
===================================================== */


function renderSideDecor() {

    const symbols =
        ["🌸", "✨", "❤️", "🕊️", "🌷", "💫"];

    const left =
        document.getElementById(
            "sideLeft"
        );

    const right =
        document.getElementById(
            "sideRight"
        );

    for (
        let i = 0;
        i < 7;
        i++
    ) {

        const symbolLeft =
            symbols[
                Math.floor(
                    Math.random() *
                    symbols.length
                )
            ];

        const symbolRight =
            symbols[
                Math.floor(
                    Math.random() *
                    symbols.length
                )
            ];

        const spanLeft =
            document.createElement(
                "span"
            );

        spanLeft.textContent =
            symbolLeft;

        spanLeft.style.animationDelay =
            (i * 0.4) + "s";

        const spanRight =
            document.createElement(
                "span"
            );

        spanRight.textContent =
            symbolRight;

        spanRight.style.animationDelay =
            (i * 0.5) + "s";

        left.appendChild(
            spanLeft
        );

        right.appendChild(
            spanRight
        );

    }

}


renderSideDecor();



/* =====================================================
   🖼️ STICKERS DE RELLENO (hasta que pongas los tuyos)
===================================================== */


const stickerFallbacks = [

    { emoji: "🌸", bg: "#ffd7e0" },
    { emoji: "✨", bg: "#ffe9ee" },
    { emoji: "🧸", bg: "#ffe0c9" },
    { emoji: "🍓", bg: "#ffd0d8" }

];


function makeFallbackSticker(
    emoji,
    bg
) {

    const svg =
        '<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140">' +
        '<circle cx="70" cy="70" r="66" fill="' + bg + '"/>' +
        '<text x="70" y="92" font-size="70" text-anchor="middle">' +
        emoji +
        '</text></svg>';

    return (
        "data:image/svg+xml;base64," +
        btoa(
            unescape(
                encodeURIComponent(svg)
            )
        )
    );

}


function initStickers() {

    const stickers =
        document.querySelectorAll(
            ".sticker"
        );

    stickers.forEach(
        (img, index) => {

            img.addEventListener(
                "error",
                function handler() {

                    img.removeEventListener(
                        "error",
                        handler
                    );

                    const fallback =
                        stickerFallbacks[
                            index %
                            stickerFallbacks.length
                        ];

                    img.src =
                        makeFallbackSticker(
                            fallback.emoji,
                            fallback.bg
                        );

                }
            );

        }
    );

}


initStickers();

/* =====================================================
   🎁 ABRIR SORPRESA
===================================================== */


function openSurprise(
    item
) {

    sendTelegramNotification(
        "🎁 Abrió el día " +
        item.day +
        ": " +
        item.title
    );

    const modal =
        document.getElementById(
            "modal"
        );

    const title =
        document.getElementById(
            "modalTitle"
        );

    const content =
        document.getElementById(
            "modalContent"
        );

    const heart =
        document.getElementById(
            "modalHeart"
        );


    title.textContent =
        item.title;


    content.innerHTML =
        "";


    heart.textContent =
        "❤️";


    /*
        MENSAJE
    */

    if (
        item.type ===
        "text"
    ) {

        content.innerHTML = `

            <div class="message">
                ${item.content}
            </div>

        `;

    }


    /*
        FOTO
    */

    else if (
        item.type ===
        "image"
    ) {

        heart.textContent =
            "📸";


        content.innerHTML = `

            ${
                item.message
                ?
                `<div class="message">
                    ${item.message}
                </div>`
                :
                ""
            }

            <img
                class="surprise-image"
                src="${item.content}"
                alt="Recuerdo"
            >

        `;

    }


    /*
        VIDEO
    */

    else if (
        item.type ===
        "video"
    ) {

        heart.textContent =
            "🎥";


        content.innerHTML = `

            ${
                item.message
                ?
                `<div class="message">
                    ${item.message}
                </div>`
                :
                ""
            }

            <video
                class="video"
                controls
                playsinline
            >

                <source
                    src="${item.content}"
                >

            </video>

        `;

    }


    /*
        ENLACE
    */

    else if (
        item.type ===
        "link"
    ) {

        heart.textContent =
            "🎵";


        content.innerHTML = `

            <div class="message">
                ${item.message}
            </div>

            <a
                class="button"
                href="${item.content}"
                target="_blank"
            >
                Abrir sorpresa ❤️
            </a>

        `;

    }


    /*
        ❤️ DÍA 24
    */

    else if (
        item.type ===
        "final"
    ) {

        heart.textContent =
            "❤️";


        content.innerHTML = `

            <div class="final-message">

                ${item.content}

            </div>

        `;


        document
            .getElementById(
                "modalCard"
            )
            .classList.add(
                "final-card"
            );

    }


    modal.classList.add(
        "show"
    );

}



/* =====================================================
   ❌ CERRAR
===================================================== */


function closeModal() {

    document
        .getElementById(
            "modal"
        )
        .classList.remove(
            "show"
        );

}



/* =====================================================
   CERRAR TOCANDO FUERA
===================================================== */


document
    .getElementById(
        "modal"
    )
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target ===
                this
            ) {

                closeModal();

            }

        }
    );

</script>
